server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets (Caddy in front also encodes, but this keeps the image
    # correct when served directly).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build output: cache forever. A missing hash (stale index.html after a
    # deploy) must be a 404, never the SPA fallback — an HTML body in place of a
    # chunk makes the dynamic import() fail with a cryptic parse error.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The optional deployer config for the landing page (see src/site/config.ts).
    # Exact match, so a deployment that mounts nothing gets a real 404 here.
    # Without this block the fallback below would answer with app.html and a 200,
    # and the boot script would try to parse HTML as JSON.
    location = /landing.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # The public landing route is prerendered to a real file (dist/index.html)
    # by scripts/prerender.mjs, so $uri and $uri/index.html serve it directly.
    # Everything else is the SPA and falls
    # back to /app.html — the pristine shell with an empty #root.
    #
    # The fallback must NOT be /index.html: that is the prerendered landing page
    # now, and serving it for /home or /organization/... would paint the marketing
    # hero before the real route boots. src/main.tsx keys off the same thing,
    # hydrating when #root has children and mounting fresh when it doesn't.
    #
    # HTML must always be revalidated so a new deploy is picked up immediately.
    location / {
        try_files $uri $uri/index.html /app.html;
        add_header Cache-Control "no-cache";
    }
}
