fragment ListMachine on ManagementMachine {
    id
    localId
    name
    ipv4
    ipv6
    connected
    ephemeral
    lastSeen
    tags
    magicDnsName
    authorized
    kind
    app {
      id
      identifier
    }
    user {
      id
      username
    }
    device {
      id
      name
    }
    hub {
      id
      name
    }
}

fragment Machine on ManagementMachine {
    ...ListMachine
    os
    keyExpiry
    isExternal
    client {
      id
    }
}
