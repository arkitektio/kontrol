fragment Layer on ManagementLayer {
  id
  name
  description
  magicDnsEnabled
  httpsEnabled
  logo {
    presignedUrl
  }
  aliases {
    ...ListInstanceAlias
  }
  machines {
    ...ListMachine
  }
}

# The keys are their own page: most meshes never need one after setup.
fragment LayerAuthKeys on ManagementLayer {
  id
  authKeys {
    ...ListIonscaleAuthKey
  }
}

fragment ListLayer on ManagementLayer {
  id
  name
  tailnetName
  description
  logo {
    presignedUrl
  }
}
