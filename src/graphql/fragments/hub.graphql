fragment ListHub  on ManagementHub {
  id
  name 
  online
  lastHealthy
  reachable
  organization {
    id
    name
  }
  instances {
    ...ListServiceInstance
  }
  clients {
    ...ListClient
  }
}

fragment Hub on ManagementHub {
  id
  name 
  online
  lastHealthy
  lastSeenAt
  version
  meshConnected
  meshHost
  reachable
  lastVerifiedAt
  publicAliases {
    id
    host
    port
    path
    probeStatus
    probedAt
    probeHttpStatus
    probeLatencyMs
    lastVerifiedAt
    instance {
      id
      release {
        id
        service {
          id
          identifier
        }
      }
    }
  }
  healthSnapshots {
    id
    healthy
    createdAt
    instances {
      identifier
      healthy
      reason
    }
  }
  organization {
    id
    name
  }
  instances {
    ...ListServiceInstance
  }
  clients {
    ...ListClient
  }
}
