fragment ListReport on ManagementReport {
  id
  functional
  createdAt
  isResolved
  resolvedAt
  resolutionNote
  resolvedBy {
    id
    username
  }
  entries {
    key
    valid
    reason
    alias {
      ...ListInstanceAlias
    }
  }
}

# A report reduced to what a timeline needs — no entries, no alias joins.
fragment TimelineReport on ManagementReport {
  id
  functional
  createdAt
  isResolved
}
