fragment Membership on ManagementMembership {
  id
  isOwner
  isScoped
  objectGrants {
    ...ObjectGrant
  }
  brandHue
  brandChroma
  allowNotifications
  hasNotificationChannel
  roles {
    identifier
    id
  }
  roleRequests {
    ...RoleRequest
  }
  user {
    id
    username
    email
    profile {
      id
      avatar {
        presignedUrl
      }
    }
  }
  organization {
    ...ListOrganization
    roles {
        id
        identifier
        description
    }
    roleSets {
      ...RoleSet
    }
  }
}

fragment ListMembership on ManagementMembership {
  id
  isScoped
  objectGrants {
    id
  }
  brandHue
  brandChroma
  roles {
    identifier
    id
  }
  user {
    id
    username
    profile {
      id
      avatar {
        presignedUrl
      }
    }
  }
  organization {
    ...SidebarOrganization
  }
}
fragment ObjectGrant on ManagementObjectGrant {
  id
  grant
  hub {
    id
    name
  }
  structure
  objectId
  reach
  createdAt
  expiresAt
  grantedBy {
    id
    username
  }
}
