fragment Organization on ManagementOrganization {
  id
  name
  slug
  description
  requireDeviceAuth
  amIOwner
  amIAdmin
  brandHue
  brandChroma
  accessTokenLifetime
  publicLinkPreview
  deeplinkApps {
    protocol
    name
    installUrl
    mobile
  }
  roles {
    id
    identifier
    description
  }
  roleSets {
    ...RoleSet
  }
  memberships {
    id
    roles {
      identifier
    }
    user {
      id
      username
      email
      profile {
        id
        avatar {
          presignedUrl
        }
      }
    }
  }
  profile {
    ...OrganizationProfile
  }
  invites {
    id
    acceptedBy {
      id
      username
      profile {
        id
        avatar {
          presignedUrl
        }
      }
    }
    status
    expiresAt
    token
    inviteUrl
  }
}

fragment ListOrganization on ManagementOrganization {
  id
  name
  slug
  brandHue
  brandChroma
  amIAdmin
}


fragment SidebarOrganization on ManagementOrganization {
  id
  name
  slug
  profile {
    ...OrganizationProfile
  }
  memberships {
    id
    roles {
      identifier
    }
    user {
      id
      username
      profile {
        id
        avatar {
          presignedUrl
        }
      }
    }
  }
  latestClients: clients(filters: { functional: true }, pagination: { limit: 5 }) {
    ...ListClient
  }
  latestServices: serviceInstances(pagination: { limit: 5 }) {
    ...ListServiceInstance
  }

}