fragment AliasRule on ManagementAliasRule {
  id
  effect
  priority
  app {
    id
    name
    identifier
  }
  client {
    id
    name
  }
  user {
    id
    username
  }
  role {
    id
    identifier
  }
  createdAt
}

fragment InstanceAlias on ManagementInstanceAlias {
  id
  host
  port
  ssl
  path
  challenge
  kind
  resolvedHost
  layer {
    id
    name
  }
  instance {
    id
  }
  organization {
    id
  }
  scope
  reach
  priority
  enabled
  effectivePriority
  rules {
    ...AliasRule
  }
}

fragment ListInstanceAlias on ManagementInstanceAlias {
  id
  host
  port
  ssl
  path
  challenge
  kind
  resolvedHost
  layer {
    id
    name
  }
  instance {
    id
    identifier
    release {
      service {
        id
        identifier
      }
      version
    }
  }
  scope
  reach
  priority
  enabled
  effectivePriority
}
