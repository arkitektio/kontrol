fragment Manifest on ManagementStagingManifest {
  identifier
  version
  requirements {
    key
    description
  }
}

fragment ServiceManifest on ManagementStagingServiceManifest {
  identifier
  version
  logo
  description
  roles {
    key
    description
  }
  scopes {
    key
    description
  }
  publicSources {
    kind
    url
  }
}


fragment HubManifest on ManagementHubManifest {
  identifier
  instances {
    manifest {
      ...ServiceManifest
    }
    description
    identifier
    aliases {
      id
      name
      kind
      scope
      ssl
      host
      port
      path
      public
    }
  }
  clients {
    manifest {
      ...HubClientManifest
    }
    description
    identifier
  }
}

# What a hub's own app asks for: the approval page resolves its scopes against
# the hub's services and the organization before anything is accepted.
fragment HubClientManifest on ManagementStagingManifest {
  identifier
  version
  description
  scopes
  requirements {
    key
    service
    optional
    description
  }
}
