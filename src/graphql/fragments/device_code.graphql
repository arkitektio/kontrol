fragment DeviceCode on ManagementDeviceCode {
  id
  code 
  stagingKind
  requestAuthKey
  stagingManifest {
    identifier
    version
    hasNodeId
    logo
    description
    repoUrl
    scopes
    requirements {
      key
      service
      optional
      description
    }
    publicSources {
      kind
      url
    }
  }
  client {
    id
    kind
    name
    release {
      version
      scopes
      app {
        identifier
      }
    }
  }
  priorAuthorizations {
    hub {
      id
      name
      organization {
        id
        name
      }
    }
    client {
      id
      name
    }
    version
    scopes
    authorizedAt
    lastSeenAt
    accessState
  }
}