query LatestClientReport($id: ID!) {
  client(id: $id) {
    id
    name
    lastReportedAt
    functional
    release {
      version
      app {
        identifier
        logo {
          presignedUrl
        }
      }
    }
    device {
      id
      name
    }
    latestReport {
      ...ListReport
    }
    lastHealthyReport {
      ...ListReport
    }
    reports {
      ...TimelineReport
    }
  }
}
