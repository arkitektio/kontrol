query OrganizationDeeplinks($id: ID!) {
  organization(id: $id) {
    id
    slug
    name
    deeplinkApps {
      protocol
      name
      installUrl
      mobile
    }
  }
}

query LinkPreview($organization: String!, $user: ID) {
  linkPreview(organization: $organization, user: $user) {
    organization {
      slug
      name
      description
      avatar {
        presignedUrl
      }
    }
    inviter {
      name
      avatar {
        presignedUrl
      }
    }
  }
}

# The invite a shared link may carry (`?invite=<token>`). Anonymous visitors only
# see public invites; a private one shows up once they are signed in.
query LinkInvite($code: String!) {
  inviteByCode(inviteCode: $code) {
    id
    token
    valid
    collaborations {
      instance
      collaboration
      roles
    }
    maxUses
    uses
    createdBy {
      id
      username
    }
    createdFor {
      id
      slug
      name
    }
  }
}
